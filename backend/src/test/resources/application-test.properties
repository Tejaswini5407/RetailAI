spring.application.name=retailai-backend-test

# Isolated Test Database Configuration (PostgreSQL retailai_test_db)
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/retailai_test_db}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration (Configurable via Environment Variables)
jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWF1dGhlbnRpY2F0aW9uLWtleS1mb3ItcmV0YWlsYWktc2Fhcy1wbGF0Zm9ybS0yNTZiaXQ=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:*,http://127.0.0.1:*
